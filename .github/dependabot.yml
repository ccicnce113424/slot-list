version: 2
updates:
  # GitHub Actions used by the workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # `dtolnay/rust-toolchain@<toolchain>` is not an action version: the ref is a Rust
      # toolchain name, and in `msrv.yml` it *is* the MSRV pin. Dependabot reads it as a
      # version and proposes `1.85.0 -> 1.120.0` (see PR #1), which would silently change
      # what the MSRV job tests. Never update it automatically; bump it by hand.
      - dependency-name: "dtolnay/rust-toolchain"

  # Cargo: the dev-dependencies (criterion, mimalloc, fast-list) and the lockfile.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    labels:
      - dependencies
    groups:
      cargo:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # flake.nix / flake.lock (nixpkgs, crane, flake-parts, fenix).
  - package-ecosystem: nix
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    labels:
      - dependencies
    groups:
      nix:
        patterns: ["*"]
