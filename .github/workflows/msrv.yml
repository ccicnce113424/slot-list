name: MSRV

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: msrv-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  msrv:
    name: "1.88"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `rust-version = "1.88"` follows from the edition-2024 let-chains
      # (`if let Some(x) = .. && cond`), stabilized in 1.88; 1.87 rejects them.
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      # The dev-dependencies are compatible with 1.88, so the full suite can run here.
      - run: cargo test
      # `no_std` + `alloc` plus the narrow-index configuration.
      - run: cargo check --lib --no-default-features
      - run: cargo check --lib --features u32-index
