name: Benchmarks

on:
  workflow_dispatch:
    inputs:
      filter:
        description: "criterion filter (empty = the job's own default: full run on x86_64, 'churn|clear_drop' on arm64)"
        type: string
        default: ""
      repeat:
        description: "measure the same commit N times, saving one criterion baseline per pass (run-to-run stability)"
        type: number
        default: 1
  schedule:
    # Weekly: keep the bench targets and the density probe compiling.
    - cron: "0 6 * * 1"

concurrency:
  group: benches-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  BENCH_REPEAT: ${{ inputs.repeat }}

jobs:
  x86_64:
    name: benches, clear probe, full suite on dispatch (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      # Both allocator configurations must keep compiling; `linked-list-cursors`
      # adds the std-`LinkedList`-cursor comparison rows (nightly only).
      - run: cargo bench --no-run --features linked-list-cursors
      - run: cargo bench --no-run --features mimalloc,linked-list-cursors
      # The `clear` density curve / break-even check behind PERFORMANCE.md §5.
      - run: cargo test --release -- --ignored --nocapture probe_clear_vs_scan

      # `Swatinem/rust-cache` caches `target`, and its post-job cleanup deletes every file
      # under `target` directories that do not look like a cargo profile (`build`,
      # `.fingerprint`, `deps`, `tests`), keeping only the directory skeleton. So a restored
      # `target/criterion` is all directories and no data. criterion checks existence, not
      # contents (`base_dir_exists`), so with `--save-baseline r1` it reads
      # `.../<bench>/r1/sample.json`, fails with "No such file or directory" once per
      # benchmark, and drops the comparison. The skeleton holds no data, so drop it first.
      - run: rm -rf target/criterion

      # Same-machine A/B is the method behind PERFORMANCE.md; a shared runner is a
      # different machine class, so read ratios inside one run and never compare
      # absolute values across runs. Measured over two x86 runner instances: the
      # code-bound groups agree within ~0.5%, the allocator-bound groups swing 8-40%.
      # `repeat > 1` measures the same commit N times in N processes and keeps one
      # criterion baseline per pass, which is the run-to-run spread on one instance.
      # The spread between two dispatches adds the instance draw on top.
      # criterion matches the whole benchmark id, so a filter also selects longer ids
      # that contain it: 'churn|clear_drop' also picks up `index_width/churn_u32`.
      - if: github.event_name == 'workflow_dispatch'
        env:
          FILTER: ${{ inputs.filter }}
        run: |
          args=()
          if [ -n "$FILTER" ]; then args+=("$FILTER"); fi
          for i in $(seq 1 "${BENCH_REPEAT:-1}"); do
            cargo bench --bench list --features mimalloc,linked-list-cursors -- --save-baseline "r$i" "${args[@]}"
          done

      # The artifact must name the machine: GitHub-hosted runner names are anonymised
      # and `ubuntu-latest` is not a CPU model.
      - if: always()
        run: |
          mkdir -p target/criterion
          { uname -a; lscpu; nproc; rustc -Vv; free -h; } > target/criterion/machine.txt 2>&1 || true

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: criterion-report-x86_64
          path: target/criterion
          if-no-files-found: ignore
          retention-days: 14

  arm64:
    name: benches, targeted run (arm64)
    # GitHub-hosted arm64 Linux runners are free for public repositories; a private
    # repository needs a plan that includes them (otherwise drop this job).
    # Purpose: the free-marking path is the part most likely to differ per ISA, but this
    # job builds the shipped read-modify-write implementation, so it cannot compare that
    # against a byte-wide store. PERFORMANCE.md §4 row 10 asks for that comparison and it
    # needs a second build. What this job does show is how the current code behaves on
    # AArch64 and whether the layout and ratio conclusions survive. This runner varies
    # 1-19% between instances even on `churn`, so it only supports large effects.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench --no-run --features linked-list-cursors
      - run: cargo bench --no-run --features mimalloc,linked-list-cursors
      - run: cargo test --release -- --ignored --nocapture probe_clear_vs_scan

      # See the x86_64 job: the cache restores `target/criterion` as a file-less skeleton,
      # which criterion mistakes for a baseline and reports as "No such file or directory".
      - run: rm -rf target/criterion

      # `churn` is the pure-code group where the free-marking write shows up, and
      # `clear_drop` covers the reclaim paths. The filter matches whole benchmark ids, so
      # this also selects `index_width/churn_u32` and `index_width/churn_usize`.
      - if: github.event_name == 'workflow_dispatch'
        env:
          FILTER: ${{ inputs.filter || 'churn|clear_drop' }}
        run: |
          args=()
          if [ -n "$FILTER" ]; then args+=("$FILTER"); fi
          for i in $(seq 1 "${BENCH_REPEAT:-1}"); do
            cargo bench --bench list --features mimalloc,linked-list-cursors -- --save-baseline "r$i" "${args[@]}"
          done

      - if: always()
        run: |
          mkdir -p target/criterion
          { uname -a; lscpu; nproc; rustc -Vv; free -h; } > target/criterion/machine.txt 2>&1 || true

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: criterion-report-arm64
          path: target/criterion
          if-no-files-found: ignore
          retention-days: 14
