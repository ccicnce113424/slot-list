[package]
name = "slot-list"
version = "0.1.0"
edition = "2024"

[lib]
name = "slot_list"
path = "src/lib.rs"

[features]
default = ["std", "mimalloc"]
# 关掉它就是 `no_std` + `alloc`（`cargo check --no-default-features`）。
std = []
# 只影响基准：`cargo bench --no-default-features` 切回系统 malloc 做 A/B 对比。
mimalloc = []
# 只影响基准：开它才对比 std `LinkedList` 的**游标**（`#![feature(linked_list_cursors)]`）
# ⇒ 只有 nightly 能开，stable 上开它会是明确报错而不是静默少几行：
#   cargo bench --features linked-list-cursors
linked-list-cursors = []

[dev-dependencies]
criterion = "0.8"
mimalloc = "0.1"
# 对照组：slotmap 索引 + 世代号（`LinkedListIndex`）的那套实现。
fast-list = "0.1.8"

[[bench]]
name = "list"
harness = false
