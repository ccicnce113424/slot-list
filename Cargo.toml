[package]
name = "slot-list"
version = "0.1.0"
edition = "2024"

[lib]
name = "slot_list"
path = "src/lib.rs"

[features]
default = ["mimalloc"]
# `cargo bench --no-default-features` 切回系统 malloc 做 A/B 对比。
mimalloc = []

[dev-dependencies]
criterion = "0.8"
mimalloc = "0.1"

[[bench]]
name = "list"
harness = false
