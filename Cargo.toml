[package]
name = "slot-list"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A doubly linked list over a contiguous slot arena, with stable O(1) slot handles, element-level cursors, three configurable memory layouts, and no_std support."
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["linked-list", "no-std", "arena", "data-structures", "slots"]
categories = ["data-structures", "no-std", "memory-management"]
authors = ["ccicnce113424 <ccicnce113424@gmail.com>"]
documentation = "https://docs.rs/slot-list"
# The repository URL is intentionally left out until the project has a remote.
exclude = [
    "/.direnv",
    "/.envrc",
    "/.jj",
    "/flake.lock",
    "/flake.nix",
    "/result",
    "/result-*",
]

[lib]
name = "slot_list"
path = "src/lib.rs"

[features]
# `std` is on by default and is a prerequisite for the tests and benchmarks
# (criterion, `std::rc` in the tests). Turning it off gives `no_std` + `alloc`:
#   cargo check --no-default-features
# With it off the bench target is skipped by `required-features`.
default = ["std"]
std = []
# Benchmarks only: use mimalloc as the global allocator. The numbers in
# PERFORMANCE.md were measured with it.
#   cargo bench --features mimalloc            # reproduce the published numbers
#   cargo bench                                # system malloc (default)
mimalloc = []
# Benchmarks only: also compare against the cursor API of std `LinkedList`
# (`#![feature(linked_list_cursors)]`), so this needs nightly:
#   cargo bench --features linked-list-cursors
linked-list-cursors = []
# Change the default link index width (`DefaultIx`) from `usize` to `u32`:
# 1/3 fewer bytes per slot and a 37% faster `append`, at the cost of a
# 2^31-1 slot ceiling. Off by default; tests use it to run the full suite with a
# narrow index.
u32-index = []

[dev-dependencies]
criterion = "0.8"
mimalloc = "0.1"
# Reference implementation with a slotmap index + generation key.
fast-list = "0.1.8"

[[bench]]
name = "list"
harness = false
# Benchmarks need std (criterion).
required-features = ["std"]
